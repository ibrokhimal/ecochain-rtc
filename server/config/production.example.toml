# Production template. Copy, adjust and keep secrets in the environment.
mode = "production"

[http]
bind = "0.0.0.0:443"
tls_cert = "/etc/ecochain-rtc/tls/fullchain.pem"
tls_key = "/etc/ecochain-rtc/tls/privkey.pem"
# Or terminate TLS in a reverse proxy and set:
# behind_tls_proxy = true

[auth]
issuer = "ecochain"
token_secret_env = "ECOCHAIN_RTC_TOKEN_SECRET"   # >= 32 random bytes
admin_key_env = "ECOCHAIN_RTC_ADMIN_KEY"         # >= 16 random bytes

[rooms]
auto_create = false            # rooms are created by the backend via POST /v1/rooms
default_max_participants = 25
max_participants_limit = 150
max_video_subscriptions = 9
max_forwarded_audio = 3       # only the loudest this many speakers are forwarded (1..=8)
reconnect_grace_secs = 30
empty_room_ttl_secs = 60
removal_memory_secs = 86400   # host removal lasts at least this long (and until the removed token expires)

[media]
udp_port = 7882
# Bind the private interface and announce the public IP (cloud 1:1 NAT).
listen = [{ bind_ip = "10.0.0.5", advertise_ip = "203.0.113.10" }]
# TURN is required for clients behind symmetric NAT or UDP-blocking firewalls.
ice_servers = [
  { urls = ["stun:stun.example.com:3478"] },
  { urls = ["turns:turn.example.com:5349?transport=tcp"], username = "ecochain", credential = "from-your-turn-service" },
]

# Ephemeral TURN credentials (coturn `use-auth-secret`): each join gets its own
# time-limited username/credential, so no static TURN password reaches clients.
# Secret must equal coturn's static-auth-secret (see deploy/coturn/).
# [media.turn]
# urls = ["turns:<DOMAIN>:443?transport=tcp", "turn:<DOMAIN>:3478?transport=udp"]
# secret_env = "ECOCHAIN_RTC_TURN_SECRET"   # inline `secret` is rejected in production
# ttl_secs = 43200                           # default 43200 (12 h), minimum 60
# ttl_secs must be >= the longest meeting: the SDK only refreshes TURN
# credentials on rejoin, so an ICE restart after expiry cannot allocate.
# A trailing newline in the secret env value is trimmed.

# Optional workplace archive. Configure a persistent private volume and a base64
# 32-byte random key. Keep the key in a secret manager; losing it loses archives.
# [storage]
# path = "/var/lib/ecochain/archives"
# master_key_env = "ECOCHAIN_ARCHIVE_MASTER_KEY"
# retention_days = 30

# Optional recording and short-chunk speech worker. Requires storage + FFmpeg.
# Use a private, capacity-limited local temp volume; plaintext exists here only
# during processing. Startup cleans only marked Ecochain worker directories.
# [recording]
# ffmpeg = "/usr/bin/ffmpeg"
# temp_path = "/var/lib/ecochain/processing"
# max_duration_secs = 14400
# max_bytes = 4294967296

# OpenAI-compatible audio transcription endpoint (multipart model/file).
# Select a model supported by your provider; credentials remain server-side.
# [providers.stt]
# endpoint = "https://api.openai.com/v1/audio/transcriptions"
# api_key_env = "ECOCHAIN_STT_API_KEY"
# model = "YOUR_SUPPORTED_TRANSCRIPTION_MODEL"
# response_format = "json" # or verbose_json for models supporting timed segments
# language = "uz"         # optional; omit for provider language detection

# OpenAI-compatible chat completion endpoint with JSON-object response support.
# [providers.summary]
# endpoint = "https://api.openai.com/v1/chat/completions"
# api_key_env = "ECOCHAIN_SUMMARY_API_KEY"
# model = "YOUR_SUPPORTED_SUMMARY_MODEL"

# Jira Cloud origin, configured issue type, and explicit project allowlist.
# Use an API token compatible with this site's /rest/api/3 endpoint. Scoped
# api.atlassian.com/ex/jira URLs are not supported by this adapter.
# [providers.jira]
# base_url = "https://YOUR_SITE.atlassian.net"
# email = "service-account@example.com"
# api_token_env = "ECOCHAIN_JIRA_API_TOKEN"
# project_keys = ["WORK"]
# issue_type_id = "10001" # replace with the site's actual issue type ID
# issue_type_name = "Task"
# [providers.jira.identity_account_ids]
# "meeting-user-identity" = "jira-account-id"
