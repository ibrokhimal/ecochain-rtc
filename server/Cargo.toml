[package]
name = "ecochain-rtc-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
default-run = "ecochain-rtc-server"
license = "Proprietary"
description = "Ecochain signaling server and WebRTC SFU built on str0m"

[dependencies]
anyhow = "1"
aws-lc-rs = "1"
zeroize = "1"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
hmac = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
str0m = { version = "=0.25.0", default-features = false, features = ["aws-lc-rs"] }
thiserror = "2"
socket2 = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net", "sync"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

# WebSocket client for the headless bot (tests and load generator).
tokio-tungstenite = "0.29"

[profile.release]
lto = "thin"
